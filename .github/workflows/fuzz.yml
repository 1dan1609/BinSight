name: Parser Fuzz

on:
  pull_request:
    branches: [main]
    paths:
      - "frontend/src/parser/**"
      - "frontend/tests/fuzz/**"
      - "packages/shared-types/**"
  schedule:
    - cron: "0 3 * * *" # nightly, 03:00 UTC

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Same reason as ci.yml: shared-types' package.json points "types"/"main" at ./dist, which
      # only exists after this build, so the fuzz suite's import of @pe-analyzer/shared-types
      # fails to resolve on a clean checkout without it.
      - name: Build shared-types
        run: pnpm --filter @pe-analyzer/shared-types build

      - name: Fuzz the PE parser against malformed/adversarial input
        run: pnpm --filter frontend test:fuzz
