name: CD

on:
  push:
    branches: [main]

concurrency:
  group: cd-main
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: backend
            dockerfile: backend/Dockerfile
          - name: frontend
            dockerfile: frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Native arm64 runner, not QEMU emulation: the target VM is an Oracle Ampere A1 (aarch64),
      # and cross-arch emulated builds are both much slower and a less faithful test of the image.
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/1dan1609/binsight-${{ matrix.name }}:latest
            ghcr.io/1dan1609/binsight-${{ matrix.name }}:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH as the non-root deploy user
        env:
          # DEPLOY_SSH_KEY holds the private key base64-encoded (see infra/RUNBOOK.md), not raw
          # PEM/OpenSSH text - a plain multi-line paste through a web textarea is too easy to
          # mangle (CRLF, dropped trailing newline, partial copy) with no useful client-side error
          # when it happens. Base64 has no whitespace-sensitive structure, so it survives intact.
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$DEPLOY_SSH_KEY" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Host key pinned to the VM's actual ed25519 fingerprint, verified directly against
          # /etc/ssh/ssh_host_ed25519_key.pub on the box itself — not trust-on-first-use, since
          # this same check runs unattended on every deploy, not just the first one.
          echo "$DEPLOY_HOST ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGkvC0U1+B6y+yjUjw9ugauQGjtBTzXXw0i+oqnBe8ZK" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes deploy@"$DEPLOY_HOST" \
            "cd ~/binsight && docker compose pull && docker compose up -d"
      - name: Clean up deploy key
        if: always()
        run: rm -f ~/.ssh/deploy_key
