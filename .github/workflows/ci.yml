name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # shared-types' package.json points "types" at ./dist/index.d.ts, which only exists after
      # this build — without it, typecheck/lint fail to resolve @pe-analyzer/shared-types on a
      # clean checkout (a locally-cached dist/ from a prior build can mask this).
      - name: Build shared-types
        run: pnpm --filter @pe-analyzer/shared-types build

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Lint
        run: pnpm -r lint

      - name: Test
        run: pnpm -r test

      - name: Build
        run: pnpm -r build
