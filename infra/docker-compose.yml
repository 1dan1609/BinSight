services:
  backend:
    image: ghcr.io/1dan1609/binsight-backend:latest
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
    volumes:
      - backend-data:/app/data
    networks:
      - internal
    # Without a memory limit a runaway container can OOM the whole host, sshd included, which
    # locks you out of the box. The image already runs as a non-root user and needs no
    # capabilities at all.
    mem_limit: 512m
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # No ports published to the host: only reachable from the frontend container's Caddy
    # reverse proxy, over the internal network. The raw Fastify service is never internet-facing.

  frontend:
    image: ghcr.io/1dan1609/binsight-frontend:latest
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - internal
    mem_limit: 256m
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    # The upstream caddy image runs as uid 0, and binding :80/:443 needs NET_BIND_SERVICE.
    # Dropping every other capability leaves that root heavily defanged without reworking the
    # image's cert-storage ownership, which running as a non-root uid would require.
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

networks:
  internal:

volumes:
  backend-data:
  caddy-data:
  caddy-config:
